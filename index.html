<script>
const poems=[
{title:"कहते हैं मुझसे",body:`कहते हैं मुझसे —
“तुम करती ही क्या हो घर में?
सब काम तो नौकरानियाँ कर जाती हैं…”

हाँ, शायद सच है,
मेरे हाथों में अब आटे की खुशबू कम रहती है,
बरतनों की खनक भी कम सुनाई देती है…

पर किसी ने कभी ये नहीं देखा
कि मैं हर दिन
अपने टूटते मन की किरचें समेटती हूँ।

वो अच्छा बेटा है,
माँ की हर खामोशी समझ लेता है,
पिता की हर थकान पढ़ लेता है।

वो अच्छा पिता भी है,
बच्चों की छोटी-छोटी मुस्कानों पर
अपनी दुनिया लुटा देता है।

पर शायद…
पति होना उसकी किस्मत में लिखा ही नहीं था।

क्योंकि एक पति
सिर्फ घर चलाने से नहीं बनता,
वो बनता है
पत्नी की आँखों में छिपे अधूरे सवाल पढ़ने से,
उसके मौन में दबे दर्द को सुनने से,
और बिना कहे उसका हाथ थाम लेने से।

घर में सब कुछ है —
सुविधाएँ, लोग, रौनक…
बस अगर कुछ नहीं है,
तो वो है
मेरे हिस्से का अपनापन।

मैं शिकायत भी नहीं करती अब,
क्योंकि कुछ रिश्ते
चीखते नहीं…
धीरे-धीरे भीतर से मर जाते हैं।`},
{title:"एक थकी हुई औरत",body:`कभी-कभी सोचती हूँ,
क्या औरत की थकान
सिर्फ उसके शरीर से नहीं,
उसकी अहमियत से भी जुड़ी होती है?

हाँ…
मैं भी थकी हुई थी।
मैं भी बाहर की तपती धूप से
झुलस कर घर लौटी थी,
कदमों में दर्द था,
चेहरे पर पसीना,
और मन में बस एक छोटी-सी उम्मीद —
कि कोई पूछ लेगा,
“बहुत थक गई हो ना?
लो, पहले पानी पी लो…”

पर नहीं।
दरवाज़ा खुलते ही
सवाल मिला —
“खाने में क्या है?”
और मैं मुस्कुरा दी,
जैसे मेरी थकान का
घर में कोई नाम ही नहीं।

अजीब होता है ना…
एक औरत सबकी भूख समझ लेती है,
पर उसकी अपनी थकान
किसी को दिखाई नहीं देती।

समझ नहीं आता,
मैं घर का हिस्सा हूँ
या बस
घर को चलाते रहने वाली एक आदत।`},
{title:"मैं रिश्ता तोड़ना नहीं चाहती थी",body:`लोग शायद कल यही कहेंगे —
“वो अच्छी बीवी नहीं थी…
घर छोड़ दिया उसने…”

पर कौन देखेगा
उन रातों को,
जहाँ मैं चुपचाप
अपने ही आँसुओं में भीगती रही?

कौन समझेगा
कि रिश्ता सिर्फ साथ रहने से नहीं चलता,
रिश्ते को ज़िंदा रखने के लिए
थोड़ा अपनापन,
थोड़ी नरमी,
और थोड़ा प्रेम भी चाहिए होता है।

मैंने कोशिश की थी…
हर रोज़ की थी।
अपने हिस्से की खामोशियाँ निगलीं,
अपनी इच्छाएँ दबाईं,
अपने दर्द को
“सब ठीक है” कहकर छुपाया।

पर कुछ लोग
घर तो दे देते हैं,
साथ नहीं दे पाते।

और सबसे ज्यादा थका देने वाली बात ये होती है
कि इंसान किसी लड़ाई में नहीं,
बल्कि एक रूखे, बेरंग रिश्ते में
धीरे-धीरे अंदर से खत्म होता जाता है।

शायद दुनिया मुझे गलत समझे,
पर मेरा दिल जानता है
कि मैं रिश्ता तोड़ना नहीं चाहती थी…
मैं बस थोड़ा-सा महसूस किया जाना चाहती थी।`},
{title:"दो पल का सुकून",body:`कभी-कभी दिल की उदासी की
कोई साफ वजह नहीं होती…
बस भीतर एक खालीपन उतर आता है।

फिर मन करता है —
पुराने दोस्त मिल जाएँ,
एक गर्म चाय का कप हो,
और वही बेफिक्र पुरानी बातें…
जहाँ हँसी बनावटी ना हो
और दिल को खुद जैसा रहने की इजाज़त हो।

मन करता है
कहीं दूर निकल जाऊँ,
जहाँ कोई सवाल ना पूछे,
कोई उम्मीदें ना रखे,
बस थोड़ी शांति हो
और मैं खुद को फिर से सुन पाऊँ।

शायद हमें हमेशा बड़े बदलाव नहीं चाहिए होते,
कभी-कभी बस
थोड़ा अपनापन,
थोड़ा सुकून,
और किसी अपने के साथ
दो पल की सच्ची बातचीत ही
थके हुए दिल को संभाल लेती है।`},
{title:"थोड़ा-सा",body:`मुझे ज़्यादा कुछ नहीं चाहिए…
ना बड़े वादे,
ना दिखावे वाला प्यार।
बस यूँ ही
बिना किसी वजह के
थोड़ा-सा याद कर लिया जाए।

थोड़ी-सी फिक्र हो —
कि मैं थक गई हूँ शायद।
थोड़ा-सा प्यार हो —
जो शब्दों से नहीं,
व्यवहार से महसूस हो।
थोड़ा-सा एहसास हो —
कि मेरी खामोशी भी कुछ कहती है।
थोड़ा-सा भरोसा हो —
कि मैं सिर्फ जिम्मेदारी नहीं,
किसी की अपनी भी हूँ।

और बस
थोड़ा-सा साथ हो —
ऐसा, जिसमें
भीड़ में भी अकेलापन ना लगे।

शायद रिश्तों को
बहुत ज्यादा नहीं चाहिए होता,
बस दिल को ये महसूस होना चाहिए
कि वो किसी के लिए
ज़रूरी है।`},
{title:"नाशुक्रे लोग",body:`नाशुक्रे लोग,
न जाने क्या ही चाहते हैं,
जो मिला है उसे कम,
जो नहीं मिला उसी का ग़म मनाते हैं।

कभी शुक्र करके तो देखो,
अपने आस-पास नज़र घुमाकर तो देखो,
कितनी बरकत दी है ख़ुदा ने,
ज़रा दिल से उसे पहचानकर तो देखो।

सिर पर छत है,
अपनों का साथ है,
दो वक़्त की रोटी और
साँसों में आज भी साँस है।

कभी किसी को
अपने हिस्से का निवाला खिलाकर तो देखो,
किसी के चेहरे पर
एक सच्ची मुस्कान लाकर तो देखो।

कभी किसी की ख़ुशी में
अपनी ख़ुशी मिलाकर तो देखो,
बिना किसी मतलब के
किसी का हाथ थामकर तो देखो।

हर ख़्वाहिश पूरी हो,
ये ज़रूरी तो नहीं,
जो मिला है वो कम हो,
ये भी तो ज़रूरी नहीं।

कभी शिकायतों से नज़र हटाकर,
शुक्र की नज़र से तो देखो,
ज़िंदगी ने क्या-क्या दिया है तुम्हें,
ज़रा गिनकर तो देखो।

जो नहीं मिला,
उसका हिसाब छोड़ दो,
जो मिला है,
उसका शुक्र तो करो।

ज़िंदगी बहुत खूबसूरत है,
बस नज़र का फ़र्क़ है—
कभी किसी को मुस्कुराकर तो देखो,
कभी ख़ुदा का शुक्र करके तो देखो…
फिर शायद समझ आएगा,
कमी ज़िंदगी में नहीं,
हमारी चाहतों में है।`},
{title:"किसी ने पूछा ही नहीं",body:`मैं क्या चाहती हूँ,
किसी ने पूछा ही नहीं,
मैं क्यों हूँ ख़ामोश,
किसी ने समझा ही नहीं।

मेरे होंठों की हँसी के पीछे
छिपे ग़म को पहचान ही नहीं पाए,
मेरी आँखों में ठहरे सवालों को
किसी ने पढ़ा ही नहीं।

मेरे दिल में जो
प्यार भरे एहसास थे,
उन्हें महसूस करने की
किसी ने कोशिश ही नहीं की।

सबने मेरी मुस्कान देखी,
किसी ने मेरी ख़ामोशी नहीं देखी,
सबने पूछा— “सब ठीक है?”
पर जवाब सुनने की
फ़ुर्सत किसी के पास नहीं थी।

मैंने भी फिर
कहना छोड़ दिया,
जो दिल में था
उसे जताना छोड़ दिया।

शायद मेरी ख़ामोशी को
सबने मेरी आदत समझ लिया,
और मेरे मुस्कुराने को
मेरी ख़ुशी…

काश, कोई एक बार
बस इतना पूछ लेता—
“तुम सच में कैसी हो?”

तो शायद
मैं भी अपने दिल की
कुछ बातें कह पाती…
और शायद कोई
मेरी ख़ामोशी को
मेरी आवाज़ समझ पाता।`},
{title:"कुछ तो क़दर कर लेते…",body:`कुछ तो क़दर कर लेते,
थोड़ी-सी तो नज़र भर देख लेते।
बहुत मेहनत की है मैंने जीवन में,
थोड़ा मान-सम्मान देकर तो देखते।

यहाँ बहुत दिल दुखता है,
जब मेरी मेहनत का फल कोई और खाता है।
कुछ लोगों को तो बहुत मज़ा आता है,
क्योंकि उनसे मेरा आगे बढ़ना सहा नहीं जाता है।

हर दिन अपनी औकात से बढ़कर काम करती हूँ मैं,
आज तक कुछ नहीं माँगा था कभी।
पर अब माँगा है तो बस इतनी-सी आस रखती हूँ—
मेरी मेहनत को भी पहचान मिले कभी।

नहीं चाहिए हीरे-जवाहरात तुम्हारे,
न कोई दौलत, न कोई उपहार चाहिए।
बस मेरे हिस्से का थोड़ा-सा प्यार,
थोड़ा-सा मान और अधिकार चाहिए।

क्योंकि हर बार चुप रह जाना
ये तो मेरी आदत हो सकती है,
पर इसका मतलब ये नहीं
कि मुझे क़दर की चाहत नहीं।

मैंने अपना सब कुछ दे दिया,
अब थोड़ा-सा अपना भी हक़ चाहती हूँ…
नहीं माँगती दुनिया भर की खुशियाँ,
बस अपने हिस्से का सम्मान चाहती हूँ।`}
];
const pages=[];
function el(html,cls='page'){const d=document.createElement('div');d.className=cls;d.innerHTML=html;return d}
const book=document.getElementById('book');
pages.push(el(`<div class="page-inner"><span class="leaf-a"></span><span class="leaf-b"></span><div class="cover-content"><div class="cover-title">ख़ामोशी की<br>आवाज़</div><div class="cover-sub">कुछ अनकहे एहसासों की कविताएँ</div><div class="cover-author">तेजिंदर कौर</div></div></div>`,`page cover`));
pages.push(el(`<div class="page-inner contents"><div class="kicker">काव्य संग्रह</div><h2>विषय-सूची</h2><div class="rule"></div><div class="toc">${poems.map((p,i)=>`<div>${String(i+1).padStart(2,'0')} · ${p.title}</div>`).join('')}</div></div><div class="page-number">2</div>`,`page`));
poems.forEach((p,i)=>{const long=i===0||i===2||i===5||i===7;pages.push(el(`<div class="page-inner"><span class="leaf-a"></span><span class="leaf-b"></span><div class="kicker" style="text-align:center">${String(i+1).padStart(2,'0')}</div><h2 class="page-title">${p.title}</h2><div class="rule"></div><div class="poem-body ${long?'long':''}">${p.body}</div><div class="page-number">${i+3}</div></div>`,`page`))});
pages.push(el(`<div class="page-inner author"><div><div class="kicker">लेखिका</div><h2>तेजिंदर कौर</h2><div class="rule"></div><p>यह संग्रह उन भावनाओं को शब्द देने की एक कोशिश है जो अक्सर रिश्तों, ज़िम्मेदारियों और रोज़मर्रा की ज़िंदगी के बीच अनकही रह जाती हैं। कुछ कविताएँ दर्द से निकली हैं, कुछ अपनापन तलाशती हैं, और कुछ हमें याद दिलाती हैं कि ज़िंदगी में शुक्र के लिए भी बहुत कुछ है।</p></div><div class="page-number">11</div></div>`,`page`));
pages.forEach(p=>book.appendChild(p));
let current=0;
function render(){pages.forEach((p,i)=>p.classList.toggle('active',i===current));count.textContent=`${current+1} / ${pages.length}`;prev.disabled=current===0;next.disabled=current===pages.length-1}
function go(n){if(n<0||n>=pages.length)return;const fresh=pages[n];current=n;fresh.classList.add('turning');setTimeout(()=>fresh.classList.remove('turning'),550);render()}
prev.onclick=()=>go(current-1);next.onclick=()=>go(current+1);
document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')go(current-1);if(e.key==='ArrowRight'||e.key===' ')go(current+1);if(e.key==='Home')go(0);if(e.key==='End')go(pages.length-1)});
let sx=0;book.addEventListener('touchstart',e=>{sx=e.changedTouches[0].clientX},{passive:true});book.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>45)go(current+(dx<0?1:-1))},{passive:true});
let down=false,px=0;book.addEventListener('mousedown',e=>{down=true;px=e.clientX});window.addEventListener('mouseup',e=>{if(!down)return;down=false;const dx=e.clientX-px;if(Math.abs(dx)>70)go(current+(dx<0?1:-1))});
document.getElementById('full').onclick=()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()};
render();
</script>
</body>
</html>
